<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transducer Lab — Enclosure & Acoustic Modeling</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-header: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa0ac;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --compare: #f59e0b;
      --auto-badge: #10b981;
      --warn: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .unit-switch {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .unit-switch button {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 6px 11px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .unit-switch.compact button {
      padding: 3px 8px;
      font-size: 0.74rem;
    }
    .unit-switch button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button {
      background: var(--panel-header);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    .workspace {
      display: grid;
      grid-template-columns: 400px 1fr;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 850px) {
      .workspace { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #13161c;
    }
    summary {
      background: var(--panel-header);
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }
    details[open] summary {
      border-bottom: 1px solid var(--border);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .section-body {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field.full { grid-column: span 2; }
    .dim-row {
      grid-column: span 2;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .auto-bar {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1f29;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .auto-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      cursor: pointer;
    }
    .auto-bar input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .tag-auto {
      color: var(--auto-badge);
      font-size: 0.7rem;
      font-weight: 600;
    }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.88rem;
      width: 100%;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    input.derived {
      border-color: rgba(16, 185, 129, 0.45);
    }
    input[readonly] {
      background: #11141a;
      font-weight: 600;
      color: #dbeafe;
    }
    input.warn-val {
      border-color: var(--warn);
      color: #fca5a5;
    }
    .main-view {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .readouts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .card .title { font-size: 0.75rem; color: var(--muted); }
    .card .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
    .chart-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      flex: 1;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    canvas {
      width: 100%;
      height: 100%;
      flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>Transducer Lab</h1>
  <div class="toolbar">
    <div class="unit-switch" role="group" aria-label="Unit System">
      <button type="button" data-unit-btn="metric" class="active" onclick="setUnits('metric')">Metric (L / cm / g)</button>
      <button type="button" data-unit-btn="imperial" onclick="setUnits('imperial')">Standard (ft³ / in / oz)</button>
    </div>
    <button onclick="pinBaseline()">Pin Baseline (Compare)</button>
    <button onclick="clearBaseline()">Clear Baseline</button>
    <button class="primary" onclick="exportSnapshot()">Export Snapshot (.json)</button>
    <button onclick="document.getElementById('importFile').click()">Import Snapshot</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSnapshot(event)" />
  </div>
</header>

<div class="workspace">
  <aside class="sidebar">
    <!-- 1. SPEAKER SECTION -->
    <details open>
      <summary>1. Speaker (Thiele/Small)</summary>
      <div class="section-body">
        <div class="auto-bar">
          <label><input type="checkbox" id="autoCalc" checked onchange="runAutoCalc()" /> Auto-solve T/S</label>
          <button type="button" style="padding:3px 8px; font-size:0.75rem;" onclick="forceSolveAll()">Solve Missing</button>
        </div>

        <div class="field full">
          <label>Driver Model / Project Name</label>
          <input type="text" id="driverName" value="Custom 10-inch Sub" oninput="onParamInput('driverName')" />
        </div>

        <div class="field">
          <label>Fs (Hz)</label>
          <input type="number" id="fs" value="32" step="0.5" oninput="onParamInput('fs')" />
        </div>
        <div class="field">
          <label>Re (Ohms)</label>
          <input type="number" id="re" value="3.6" step="0.1" oninput="onParamInput('re')" />
        </div>

        <div class="field">
          <label>Qes <span class="tag-auto" id="tag-qes"></span></label>
          <input type="number" id="qes" value="0.50" step="0.01" oninput="onParamInput('qes')" />
        </div>
        <div class="field">
          <label>Qms <span class="tag-auto" id="tag-qms"></span></label>
          <input type="number" id="qms" value="4.50" step="0.1" oninput="onParamInput('qms')" />
        </div>

        <div class="field">
          <label>Qts <span class="tag-auto" id="tag-qts"></span></label>
          <input type="number" id="qts" value="0.45" step="0.01" oninput="onParamInput('qts')" />
        </div>
        <div class="field">
          <label><span id="lbl-mms">Mms (grams)</span></label>
          <input type="number" id="mms" value="110" step="1" oninput="onParamInput('mms')" />
        </div>

        <div class="field">
          <label><span id="lbl-dd">Piston Dia Dd (cm)</span></label>
          <input type="number" id="dd" value="21.0" step="0.1" oninput="onParamInput('dd')" />
        </div>
        <div class="field">
          <label><span id="lbl-sd">Sd (cm²)</span> <span class="tag-auto" id="tag-sd"></span></label>
          <input type="number" id="sd" value="346.4" step="0.5" oninput="onParamInput('sd')" />
        </div>

        <div class="field">
          <label><span id="lbl-vas">Vas (Liters)</span> <span class="tag-auto" id="tag-vas"></span></label>
          <input type="number" id="vas" value="35.0" step="0.5" oninput="onParamInput('vas')" />
        </div>
        <div class="field">
          <label>Bl (T·m) <span class="tag-auto" id="tag-bl"></span></label>
          <input type="number" id="bl" value="12.6" step="0.1" oninput="onParamInput('bl')" />
        </div>

        <div class="field full">
          <label><span id="lbl-xmax">Xmax (mm)</span></label>
          <input type="number" id="xmax" value="14" step="0.5" oninput="onParamInput('xmax')" />
        </div>
      </div>
    </details>

    <!-- 2. ENCLOSURE GEOMETRY SECTION -->
    <details open>
      <summary>2. Enclosure Geometry</summary>
      <div class="section-body">
        <div class="auto-bar">
          <span style="color:var(--muted);">Enclosure Units</span>
          <div class="unit-switch compact" role="group" aria-label="Enclosure Unit System">
            <button type="button" data-unit-btn="metric" class="active" onclick="setUnits('metric')">Metric (L / cm)</button>
            <button type="button" data-unit-btn="imperial" onclick="setUnits('imperial')">Standard (ft³ / in)</button>
          </div>
        </div>

        <div class="field full">
          <label>Alignment Type</label>
          <select id="boxType" onchange="onBoxTypeChange()">
            <option value="sealed">Sealed (Acoustic Suspension)</option>
            <option value="ported" selected>Ported (Bass Reflex)</option>
            <option value="bp4">4th-Order Bandpass</option>
          </select>
        </div>

        <div class="dim-row">
          <div class="field">
            <label><span id="lbl-boxW">Int. W (cm)</span></label>
            <input type="number" id="boxW" placeholder="opt" step="0.5" oninput="calcBoxVolFromDims()" />
          </div>
          <div class="field">
            <label><span id="lbl-boxH">Int. H (cm)</span></label>
            <input type="number" id="boxH" placeholder="opt" step="0.5" oninput="calcBoxVolFromDims()" />
          </div>
          <div class="field">
            <label><span id="lbl-boxD">Int. D (cm)</span></label>
            <input type="number" id="boxD" placeholder="opt" step="0.5" oninput="calcBoxVolFromDims()" />
          </div>
        </div>

        <div class="field">
          <label><span id="lbl-vb">Net Volume Vb (L)</span></label>
          <input type="number" id="vb" value="42" step="0.5" oninput="update()" />
        </div>
        <div class="field" id="frontChamberField" style="display:none;">
          <label><span id="lbl-vf">Front Chamber Vf (L)</span></label>
          <input type="number" id="vf" value="28" step="0.5" oninput="update()" />
        </div>
        <div class="field" id="qlField">
          <label>Stuffing / Damping (Ql)</label>
          <input type="number" id="ql" value="7" step="0.5" oninput="update()" />
        </div>
      </div>
    </details>

    <!-- 3. PORT GEOMETRY SECTION -->
    <details open id="portSection">
      <summary>3. Port Geometry</summary>
      <div class="section-body">
        <div class="auto-bar">
          <span style="color:var(--muted);">Port Units</span>
          <div class="unit-switch compact" role="group" aria-label="Port Unit System">
            <button type="button" data-unit-btn="metric" class="active" onclick="setUnits('metric')">Metric (cm)</button>
            <button type="button" data-unit-btn="imperial" onclick="setUnits('imperial')">Standard (in)</button>
          </div>
        </div>

        <div class="field">
          <label>Port Shape</label>
          <select id="portShape" onchange="update()">
            <option value="slot" selected>Slot / Rectangular</option>
            <option value="round">Round Tube</option>
          </select>
        </div>
        <div class="field">
          <label>Number of Ports</label>
          <input type="number" id="numPorts" value="1" min="1" max="16" step="1" oninput="update()" />
        </div>

        <!-- Slot / Rectangular Port Width & Height -->
        <div class="field" id="slotWidthField">
          <label><span id="lbl-portWidth">Port Width (cm)</span></label>
          <input type="number" id="portWidth" value="3.5" step="0.2" oninput="update()" />
        </div>
        <div class="field" id="slotHeightField">
          <label><span id="lbl-portHeight">Port Height (cm)</span></label>
          <input type="number" id="portHeight" value="25.0" step="0.5" oninput="update()" />
        </div>

        <!-- Round Port Diameter -->
        <div class="field full" id="roundPortFields" style="display:none;">
          <label><span id="lbl-portDia">Port Diameter (cm)</span></label>
          <input type="number" id="portDia" value="10.0" step="0.5" oninput="update()" />
        </div>

        <div class="field">
          <label>Tuning Freq Fb (Hz)</label>
          <input type="number" id="fb" value="34" step="0.5" oninput="update()" />
        </div>
        <div class="field">
          <label>End Correction (k)</label>
          <select id="endCorr" onchange="update()">
            <option value="0.850" selected>Slot on Wall / 2 Flange (0.85)</option>
            <option value="0.732">1 End Flanged (0.732)</option>
            <option value="0.614">Unflanged Pipe (0.614)</option>
          </select>
        </div>

        <!-- Computed Port Outputs -->
        <div class="field">
          <label><span id="lbl-portArea">Total Port Area (cm²)</span></label>
          <input type="text" id="portArea" readonly />
        </div>
        <div class="field">
          <label><span id="lbl-portVel">Peak Air Speed (m/s)</span></label>
          <input type="text" id="portVel" readonly />
        </div>

        <div class="field full">
          <label><span id="lbl-portLen">Length per Port (cm)</span></label>
          <input type="text" id="portLen" readonly />
        </div>
      </div>
    </details>

    <!-- 4. DRIVE & FILTER SECTION -->
    <details>
      <summary>4. Drive & Cabin Filter</summary>
      <div class="section-body">
        <div class="field">
          <label>Input Power (Watts)</label>
          <input type="number" id="power" value="300" step="10" oninput="update()" />
        </div>
        <div class="field">
          <label>Cabin Gain (+dB/oct below 50Hz)</label>
          <input type="number" id="cabinGain" value="0" step="1" oninput="update()" />
        </div>
      </div>
    </details>
  </aside>

  <main class="main-view">
    <div class="readouts">
      <div class="card">
        <div class="title">EBP (Fs / Qes)</div>
        <div class="val" id="outEbp">—</div>
      </div>
      <div class="card">
        <div class="title">System F3 (-3 dB)</div>
        <div class="val" id="outF3">—</div>
      </div>
      <div class="card">
        <div class="title">Alpha (Vas / Vb)</div>
        <div class="val" id="outAlpha">—</div>
      </div>
      <div class="card">
        <div class="title">System Qtc (Sealed/Rear)</div>
        <div class="val" id="outQtc">—</div>
      </div>
    </div>

    <div class="chart-box">
      <div class="legend">
        <span><i class="dot" style="background:var(--accent)"></i>Active Magnitude (dB)</span>
        <span><i class="dot" style="background:var(--compare)"></i>Pinned Baseline (dB)</span>
      </div>
      <canvas id="respChart"></canvas>
    </div>
  </main>
</div>

<script>
  let baselineCurve = null;
  let currentUnits = "metric"; // "metric" or "imperial"

  // Conversion factors: multiply Metric value by factor to get Standard (Imperial) value
  const CONV = {
    mms:        { factor: 0.03527396, mDec: 1, iDec: 2, mStep: 1,   iStep: 0.05, mLabel: "Mms (grams)",         iLabel: "Mms (oz)" },
    dd:         { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.1, iStep: 0.05, mLabel: "Piston Dia Dd (cm)",  iLabel: "Piston Dia Dd (in)" },
    sd:         { factor: 0.15500031, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.1,  mLabel: "Sd (cm²)",            iLabel: "Sd (in²)" },
    vas:        { factor: 0.03531467, mDec: 2, iDec: 3, mStep: 0.5, iStep: 0.05, mLabel: "Vas (Liters)",        iLabel: "Vas (ft³)" },
    xmax:       { factor: 0.03937008, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.02, mLabel: "Xmax (mm)",           iLabel: "Xmax (in)" },
    boxW:       { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.1,  mLabel: "Int. W (cm)",         iLabel: "Int. W (in)" },
    boxH:       { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.1,  mLabel: "Int. H (cm)",         iLabel: "Int. H (in)" },
    boxD:       { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.1,  mLabel: "Int. D (cm)",         iLabel: "Int. D (in)" },
    vb:         { factor: 0.03531467, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.05, mLabel: "Net Volume Vb (L)",   iLabel: "Net Volume Vb (ft³)" },
    vf:         { factor: 0.03531467, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.05, mLabel: "Front Chamber Vf (L)",iLabel: "Front Chamber Vf (ft³)" },
    portDia:    { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.05, mLabel: "Port Diameter (cm)",  iLabel: "Port Diameter (in)" },
    portWidth:  { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.2, iStep: 0.05, mLabel: "Port Width (cm)",     iLabel: "Port Width (in)" },
    portHeight: { factor: 0.39370079, mDec: 1, iDec: 2, mStep: 0.5, iStep: 0.1,  mLabel: "Port Height (cm)",    iLabel: "Port Height (in)" }
  };

  const fields = [
    "driverName", "fs", "re", "qes", "qms", "qts",
    "mms", "dd", "sd", "vas", "bl", "xmax",
    "boxType", "boxW", "boxH", "boxD", "vb", "vf", "ql",
    "portShape", "numPorts", "portWidth", "portHeight", "portDia",
    "fb", "endCorr", "power", "cabinGain"
  ];

  // Read any field normalized to Metric (g, cm, cm², L, mm)
  function getMetric(id) {
    const el = document.getElementById(id);
    if (!el) return 0;
    const raw = parseFloat(el.value);
    if (Number.isNaN(raw)) return 0;
    if (currentUnits === "imperial" && CONV[id]) {
      return raw / CONV[id].factor;
    }
    return raw;
  }

  // Write a Metric value into an input field formatted for the active unit system
  function setMetric(id, metricVal, markDerived = false) {
    const el = document.getElementById(id);
    if (!el || !Number.isFinite(metricVal)) return;
    const cfg = CONV[id];
    if (cfg) {
      const displayVal = currentUnits === "imperial" ? metricVal * cfg.factor : metricVal;
      const dec = currentUnits === "imperial" ? cfg.iDec : cfg.mDec;
      el.value = displayVal.toFixed(dec);
    } else {
      el.value = Number(metricVal.toPrecision(4));
    }
    if (markDerived) {
      el.classList.add("derived");
      const tag = document.getElementById("tag-" + id);
      if (tag) tag.textContent = "AUTO";
    }
  }

  // Universal Unit Toggle across Header, Enclosure Geometry, and Port Geometry
  function setUnits(targetUnits) {
    if (targetUnits !== "metric" && targetUnits !== "imperial") return;
    if (targetUnits === currentUnits) return;

    const toImperial = targetUnits === "imperial";

    // Sync active highlight on ALL unit toggle buttons across the page
    document.querySelectorAll
