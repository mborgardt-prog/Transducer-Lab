<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transducer Lab — Enclosure & Acoustic Modeling</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-header: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa0ac;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --compare: #f59e0b;
      --auto-badge: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: var(--panel-header);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    .workspace {
      display: grid;
      grid-template-columns: 380px 1fr;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 850px) {
      .workspace { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #13161c;
    }
    summary {
      background: var(--panel-header);
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }
    details[open] summary {
      border-bottom: 1px solid var(--border);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .section-body {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field.full { grid-column: span 2; }
    .auto-bar {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1f29;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .auto-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      cursor: pointer;
    }
    .auto-bar input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .tag-auto {
      color: var(--auto-badge);
      font-size: 0.7rem;
      font-weight: 600;
    }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.88rem;
      width: 100%;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    input.derived {
      border-color: rgba(16, 185, 129, 0.45);
    }
    .main-view {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .readouts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .card .title { font-size: 0.75rem; color: var(--muted); }
    .card .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
    .chart-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      flex: 1;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    canvas {
      width: 100%;
      height: 100%;
      flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>Transducer Lab</h1>
  <div class="toolbar">
    <button onclick="pinBaseline()">Pin Baseline (Compare)</button>
    <button onclick="clearBaseline()">Clear Baseline</button>
    <button class="primary" onclick="exportSnapshot()">Export Snapshot (.json)</button>
    <button onclick="document.getElementById('importFile').click()">Import Snapshot</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSnapshot(event)" />
  </div>
</header>

<div class="workspace">
  <aside class="sidebar">
    <!-- 1. SPEAKER SECTION -->
    <details open>
      <summary>1. Speaker (Thiele/Small)</summary>
      <div class="section-body">
        <div class="auto-bar">
          <label><input type="checkbox" id="autoCalc" checked onchange="runAutoCalc()" /> Auto-solve T/S</label>
          <button type="button" style="padding:3px 8px; font-size:0.75rem;" onclick="forceSolveAll()">Solve Missing</button>
        </div>

        <div class="field full">
          <label>Driver Model / Project Name</label>
          <input type="text" id="driverName" value="Custom 10-inch Sub" oninput="onParamInput('driverName')" />
        </div>

        <div class="field">
          <label>Fs (Hz)</label>
          <input type="number" id="fs" value="32" step="0.5" oninput="onParamInput('fs')" />
        </div>
        <div class="field">
          <label>Re (Ohms)</label>
          <input type="number" id="re" value="3.6" step="0.1" oninput="onParamInput('re')" />
        </div>

        <div class="field">
          <label>Qes <span class="tag-auto" id="tag-qes"></span></label>
          <input type="number" id="qes" value="0.50" step="0.01" oninput="onParamInput('qes')" />
        </div>
        <div class="field">
          <label>Qms <span class="tag-auto" id="tag-qms"></span></label>
          <input type="number" id="qms" value="4.50" step="0.1" oninput="onParamInput('qms')" />
        </div>

        <div class="field">
          <label>Qts <span class="tag-auto" id="tag-qts"></span></label>
          <input type="number" id="qts" value="0.45" step="0.01" oninput="onParamInput('qts')" />
        </div>
        <div class="field">
          <label>Mms (grams)</label>
          <input type="number" id="mms" value="110" step="1" oninput="onParamInput('mms')" />
        </div>

        <div class="field">
          <label>Piston Dia Dd (cm)</label>
          <input type="number" id="dd" value="21.0" step="0.1" oninput="onParamInput('dd')" />
        </div>
        <div class="field">
          <label>Sd (cm²) <span class="tag-auto" id="tag-sd"></span></label>
          <input type="number" id="sd" value="346.4" step="0.5" oninput="onParamInput('sd')" />
        </div>

        <div class="field">
          <label>Vas (Liters) <span class="tag-auto" id="tag-vas"></span></label>
          <input type="number" id="vas" value="35.0" step="0.5" oninput="onParamInput('vas')" />
        </div>
        <div class="field">
          <label>Bl (T·m) <span class="tag-auto" id="tag-bl"></span></label>
          <input type="number" id="bl" value="12.6" step="0.1" oninput="onParamInput('bl')" />
        </div>

        <div class="field full">
          <label>Xmax (mm)</label>
          <input type="number" id="xmax" value="14" step="0.5" oninput="onParamInput('xmax')" />
        </div>
      </div>
    </details>

    <!-- 2. ENCLOSURE GEOMETRY SECTION -->
    <details open>
      <summary>2. Enclosure Geometry</summary>
      <div class="section-body">
        <div class="field full">
          <label>Alignment Type</label>
          <select id="boxType" onchange="update()">
            <option value="sealed">Sealed (Acoustic Suspension)</option>
            <option value="ported" selected>Ported (Bass Reflex)</option>
          </select>
        </div>
        <div class="field">
          <label>Net Volume Vb (Liters)</label>
          <input type="number" id="vb" value="42" step="0.5" oninput="update()" />
        </div>
        <div class="field">
          <label>Stuffing / Damping (Ql)</label>
          <input type="number" id="ql" value="7" step="0.5" oninput="update()" />
        </div>
      </div>
    </details>

    <!-- 3. PORT GEOMETRY SECTION -->
    <details open id="portSection">
      <summary>3. Port Geometry</summary>
      <div class="section-body">
        <div class="field">
          <label>Tuning Freq Fb (Hz)</label>
          <input type="number" id="fb" value="34" step="0.5" oninput="update()" />
        </div>
        <div class="field">
          <label>Port Diameter (cm)</label>
          <input type="number" id="portDia" value="10" step="0.5" oninput="update()" />
        </div>
        <div class="field full">
          <label>Calculated Port Length (cm)</label>
          <input type="text" id="portLen" readonly />
        </div>
      </div>
    </details>

    <!-- 4. DRIVE & FILTER SECTION -->
    <details>
      <summary>4. Drive & Cabin Filter</summary>
      <div class="section-body">
        <div class="field">
          <label>Input Power (Watts)</label>
          <input type="number" id="power" value="300" step="10" oninput="update()" />
        </div>
        <div class="field">
          <label>Cabin Gain (+dB/oct below 50Hz)</label>
          <input type="number" id="cabinGain" value="0" step="1" oninput="update()" />
        </div>
      </div>
    </details>
  </aside>

  <main class="main-view">
    <div class="readouts">
      <div class="card">
        <div class="title">EBP (Fs / Qes)</div>
        <div class="val" id="outEbp">—</div>
      </div>
      <div class="card">
        <div class="title">System F3 (-3 dB)</div>
        <div class="val" id="outF3">—</div>
      </div>
      <div class="card">
        <div class="title">Alpha (Vas / Vb)</div>
        <div class="val" id="outAlpha">—</div>
      </div>
      <div class="card">
        <div class="title">System Qtc (Sealed)</div>
        <div class="val" id="outQtc">—</div>
      </div>
    </div>

    <div class="chart-box">
      <div class="legend">
        <span><i class="dot" style="background:var(--accent)"></i>Active Magnitude (dB)</span>
        <span><i class="dot" style="background:var(--compare)"></i>Pinned Baseline (dB)</span>
      </div>
      <canvas id="respChart"></canvas>
    </div>
  </main>
</div>

<script>
  let baselineCurve = null;
  let lastEdited = null;

  const fields = [
    "driverName", "fs", "re", "qes", "qms", "qts",
    "mms", "dd", "sd", "vas", "bl", "xmax",
    "boxType", "vb", "ql", "fb", "portDia", "power", "cabinGain"
  ];

  // Physical constants at ~20°C sea level
  const RHO = 1.204;   // air density kg/m^3
  const C = 343.2;     // speed of sound m/s
  const RHO_C2 = RHO * C * C;

  function num(id) {
    const v = parseFloat(document.getElementById(id).value);
    return Number.isFinite(v) && v > 0 ? v : null;
  }

  function setDerived(id, value, decimals) {
    const el = document.getElementById(id);
    const tag = document.getElementById("tag-" + id);
    if (value !== null && Number.isFinite(value) && value > 0) {
      el.value = value.toFixed(decimals);
      el.classList.add("derived");
      if (tag) tag.textContent = "AUTO";
    }
  }

  function clearDerivedBadge(id) {
    const el = document.getElementById(id);
    const tag = document.getElementById("tag-" + id);
    if (el) el.classList.remove("derived");
    if (tag) tag.textContent = "";
  }

  function onParamInput(id) {
    lastEdited = id;
    clearDerivedBadge(id);
    if (document.getElementById("autoCalc").checked) {
      runAutoCalc(id);
    }
    update();
  }

  function forceSolveAll() {
    runAutoCalc(null, true);
    update();
  }

  function runAutoCalc(triggerId = null, forceEmptyOnly = false) {
    const fs = num("fs");
    const re = num("re");
    let qes = num("qes");
    let qms = num("qms");
    let qts = num("qts");
    const mmsGrams = num("mms");
    const ddCm = num("dd");
    let sdCm2 = num("sd");
    let vasLiters = num("vas");
    let bl = num("bl");

    // 1. Solve Sd from Piston Diameter Dd (cm)
    if (ddCm && (triggerId === "dd" || !sdCm2)) {
      sdCm2 = Math.PI * Math.pow(ddCm / 2, 2);
      setDerived("sd", sdCm2, 1);
    }

    // 2. Solve Qts / Qes / Qms triangle
    if (triggerId === "qes" || triggerId === "qms") {
      if (qes && qms) {
        qts = (qms * qes) / (qms + qes);
        setDerived("qts", qts, 3);
      }
    } else if (triggerId === "qts") {
      if (qts && qms && qms > qts) {
        qes = (qms * qts) / (qms - qts);
        setDerived("qes", qes, 3);
      } else if (qts && qes && qes > qts) {
        qms = (qes * qts) / (qes - qts);
        setDerived("qms", qms, 2);
      }
    } else {
      // Fill whichever one of the three is missing
      if (!qts && qes && qms) {
        qts = (qms * qes) / (qms + qes);
        setDerived("qts", qts, 3);
      } else if (!qes && qts && qms && qms > qts) {
        qes = (qms * qts) / (qms - qts);
        setDerived("qes", qes, 3);
      } else if (!qms && qts && qes && qes > qts) {
        qms = (qes * qts) / (qes - qts);
        setDerived("qms", qms, 2);
      }
    }

    // 3. Solve Vas (Liters) from Fs, Mms (g), and Sd (cm^2)
    // Cms = 1 / ((2*pi*Fs)^2 * Mms_kg), Vas_m3 = rho * c^2 * Sd_m2^2 * Cms
    const canSolveVas = fs && mmsGrams && sdCm2;
    const vasInputsChanged = ["fs", "mms", "dd", "sd"].includes(triggerId);
    if (canSolveVas && (vasInputsChanged || !vasLiters)) {
      const mmsKg = mmsGrams / 1000;
      const sdM2 = sdCm2 / 10000;
      const omega = 2 * Math.PI * fs;
      const cms = 1 / (omega * omega * mmsKg);
      const vasM3 = RHO_C2 * sdM2 * sdM2 * cms;
      vasLiters = vasM3 * 1000;
      setDerived("vas", vasLiters, 2);
    }

    // 4. Solve Bl (T·m) from Fs, Mms (g), Re, and Qes
    // Qes = (2 * pi * Fs * Mms_kg * Re) / Bl^2  =>  Bl = sqrt((2 * pi * Fs * Mms_kg * Re) / Qes)
    const canSolveBl = fs && mmsGrams && re && qes;
    const blInputsChanged = ["fs", "mms", "re", "qes", "qts"].includes(triggerId);
    if (canSolveBl && (blInputsChanged || !bl)) {
      const mmsKg = mmsGrams / 1000;
      bl = Math.sqrt((2 * Math.PI * fs * mmsKg * re) / qes);
      setDerived("bl", bl, 2);
    }
  }

  function getParams() {
    const p = {};
    fields.forEach(id => {
      const el = document.getElementById(id);
      p[id] = el.type === "number" ? parseFloat(el.value) || 0 : el.value;
    });
    return p;
  }

  function setParams(p) {
    fields.forEach(id => {
      if (p[id] !== undefined) {
        document.getElementById(id).value = p[id];
        clearDerivedBadge(id);
      }
    });
    update();
  }

  function calcResponse(p) {
    const freqs = [];
    const mags = [];
    const alpha = p.vas / Math.max(p.vb, 0.1);
    const qtc = p.qts * Math.sqrt(1 + alpha);
    const fc = p.fs * Math.sqrt(1 + alpha);

    for (let i = 0; i <= 120; i++) {
      const f = 10 * Math.pow(20, i / 120);
      freqs.push(f);
      let db = 0;

      if (p.boxType === "sealed") {
        const fn = f / fc;
        const fn2 = fn * fn;
        const denom = Math.sqrt(Math.pow(1 - fn2, 2) + Math.pow(fn / qtc, 2));
        db = 20 * Math.log10(fn2 / denom);
      } else {
        const fn = f / p.fs;
        const h = p.fb / p.fs;
        const fn2 = fn * fn;
        const fn4 = fn2 * fn2;
        const a1 = (h / p.ql) + (1 / p.qts);
        const a2 = 1 + alpha + (h * h) + (h / (p.qts * p.ql));
        const a3 = (h / p.qts) + ((h * h) / p.ql);
        const a4 = h * h;

        const real = fn4 - a2 * fn2 + a4;
        const imag = a3 * fn - a1 * fn * fn2;
        const denom = Math.sqrt(real * real + imag * imag);
        db = 20 * Math.log10(fn4 / Math.max(denom, 1e-6));
      }

      if (p.cabinGain > 0 && f < 50) {
        db += p.cabinGain * Math.log2(50 / f);
      }
      mags.push(db);
    }
    return { freqs, mags, alpha, qtc, fc };
  }

  function update() {
    const p = getParams();
    document.getElementById("portSection").style.display = p.boxType === "ported" ? "block" : "none";

    if (p.boxType === "ported" && p.vb > 0 && p.fb > 0) {
      const lv = (23562.5 * p.portDia * p.portDia) / (p.vb * p.fb * p.fb) - (0.732 * p.portDia);
      document.getElementById("portLen").value = lv > 0 ? lv.toFixed(1) + " cm" : "Port too small/short";
    }

    const res = calcResponse(p);
    const ebp = p.qes > 0 ? (p.fs / p.qes).toFixed(1) : "—";
    document.getElementById("outEbp").textContent = ebp;
    document.getElementById("outAlpha").textContent = res.alpha.toFixed(2);
    document.getElementById("outQtc").textContent = p.boxType === "sealed" ? res.qtc.toFixed(2) : "N/A";

    let f3 = "—";
    for (let i = 0; i < res.freqs.length; i++) {
      if (res.mags[i] >= -3.0) {
        f3 = res.freqs[i].toFixed(1) + " Hz";
        break;
      }
    }
    document.getElementById("outF3").textContent = f3;

    drawChart(res.freqs, res.mags);
  }

  function drawChart(freqs, mags) {
    const canvas = document.getElementById("respChart");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = rect.height;
    const pad = { top: 20, right: 20, bottom: 30, left: 40 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = "#2a2f3a";
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "11px sans-serif";
    ctx.lineWidth = 1;

    for (let db = 6; db >= -24; db -= 6) {
      const y = pad.top + ((6 - db) / 30) * plotH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      ctx.fillText(db + "dB", 4, y + 4);
    }

    [10, 20, 30, 40, 50, 80, 100, 150, 200].forEach(f => {
      const x = pad.left + (Math.log(f / 10) / Math.log(20)) * plotW;
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, h - pad.bottom);
      ctx.stroke();
      ctx.fillText(f + "Hz", x - 12, h - 10);
    });

    function plotLine(dataMags, color, dashed) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      if (dashed) ctx.setLineDash([5, 5]);
      ctx.beginPath();
      freqs.forEach((f, idx) => {
        const x = pad.left + (Math.log(f / 10) / Math.log(20)) * plotW;
        const clamped = Math.max(-24, Math.min(6, dataMags[idx]));
        const y = pad.top + ((6 - clamped) / 30) * plotH;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();
    }

    if (baselineCurve) plotLine(baselineCurve, "#f59e0b", true);
    plotLine(mags, "#3b82f6", false);
  }

  function pinBaseline() {
    const res = calcResponse(getParams());
    baselineCurve = res.mags;
    update();
  }

  function clearBaseline() {
    baselineCurve = null;
    update();
  }

  function exportSnapshot() {
    const p = getParams();
    const payload = {
      timestamp: new Date().toISOString(),
      parameters: p
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (p.driverName || "transducer-snapshot").toLowerCase().replace(/[^a-z0-9]+/g, "-");
    a.href = url;
    a.download = `${safeName}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importSnapshot(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.parameters) {
          setParams(data.parameters);
        }
      } catch (err) {
        alert("Invalid snapshot JSON file.");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  window.addEventListener("resize", update);
  update();
</script>

</body>
</html>
