<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transducer Lab — Enclosure & Acoustic Modeling</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-header: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa0ac;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --compare: #f59e0b;
      --auto-badge: #10b981;
      --warn: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .unit-switch {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .unit-switch button {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 6px 11px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .unit-switch.compact button {
      padding: 3px 8px;
      font-size: 0.74rem;
    }
    .unit-switch button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button {
      background: var(--panel-header);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    .workspace {
      display: grid;
      grid-template-columns: 390px 1fr;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 850px) {
      .workspace { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #13161c;
    }
    summary {
      background: var(--panel-header);
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }
    details[open] summary {
      border-bottom: 1px solid var(--border);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .section-body {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field.full { grid-column: span 2; }
    .auto-bar {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1f29;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .auto-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      cursor: pointer;
    }
    .auto-bar input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .tag-auto {
      color: var(--auto-badge);
      font-size: 0.7rem;
      font-weight: 600;
    }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.88rem;
      width: 100%;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    input.derived {
      border-color: rgba(16, 185, 129, 0.45);
    }
    input[readonly] {
      background: #11141a;
      font-weight: 600;
      color: #dbeafe;
    }
    input.warn-val {
      border-color: var(--warn);
      color: #fca5a5;
    }
    .main-view {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .readouts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .card .title { font-size: 0.75rem; color: var(--muted); }
    .card .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
    .chart-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      flex: 1;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    canvas {
      width: 100%;
      height: 100%;
      flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>Transducer Lab</h1>
  <div class="toolbar">
    <div class="unit-switch" role="group" aria-label="Unit System">
      <button type="button" data-unit-btn="metric" class="active" onclick="setUnits('metric')">Metric (L / cm / g)</button>
      <button type="button" data-unit-btn="imperial" onclick="setUnits('imperial')">Imperial (ft³ / in / oz)</button>
    </div>
    <button onclick="pinBaseline()">Pin Baseline (Compare)</button>
    <button onclick="clearBaseline()">Clear Baseline</button>
    <button class="primary" onclick="exportSnapshot()">Export Snapshot (.json)</button>
    <button onclick="document.getElementById('importFile').click()">Import Snapshot</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSnapshot(event)" />
  </div>
</header>

<div class="workspace">
  <aside class="sidebar">
    <!-- 1. SPEAKER SECTION -->
    <details open>
      <summary>1. Speaker (Thiele/Small)</summary>
      <div class="section-body">
        <div class="auto-bar">
          <label><input type="checkbox" id="autoCalc" checked onchange="runAutoCalc()" /> Auto-solve T/S</label>
          <button type="button" style="padding:3px 8px; font-size:0.75rem;" onclick="forceSolveAll()">Solve Missing</button>
        </div>

        <div class="field full">
          <label>Driver Model / Project Name</
